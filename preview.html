<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Banner Preview</title>
  <style>
    body {
      background-color: #030712;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      padding: 40px;
      font-family: sans-serif;
    }
    .wrapper { width: 90%; max-width: 1180px; }
  </style>
</head>
<body>
  <h2>Dark Mode Preview (banner-dark.v9.svg)</h2>
  <div class="wrapper">
    <img src="assets/banner-dark.v9.svg" width="100%" alt="Dark Banner">
  </div>

  <h2>Light Mode Preview (banner-light.v9.svg)</h2>
  <div class="wrapper" style="background: #ffffff; padding: 20px; border-radius: 8px;">
    <img src="assets/banner-light.v9.svg" width="100%" alt="Light Banner">
  </div>
</body>
</html>
